[project]
name = "nofe"
version = "0.1.0"
description = "Neural operator function embedding: graph-kernel dimensionality reduction."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "numpy>=2.0",
    "torch>=2.6,<3",
    "torch-geometric>=2.6",
    # The cKDTree backend: it is what macOS uses, so it is a runtime dependency everywhere rather
    # than an extra. Without it neither neighbourhood backend would exist.
    "scipy>=1.13",
    # faiss is the fast backend and the default off macOS. It is deliberately NOT installed on
    # macOS: the wheel vendors its own libomp.dylib and aborts at import next to torch's
    # (`OMP: Error #15`), so a plain `uv sync` there would need a repair step before anything ran.
    # macOS gets cKDTree out of the box; to switch to faiss, install it and run
    # tools/repair_faiss_omp.py (see README, "Neighbour backend").
    #
    # Capped below 1.16: that is the last series publishing a `macosx_14_0_arm64` wheel (1.16.0
    # jumps to `macosx_15_0_arm64` and ships no sdist), and torch 2.15 supports macOS 14.
    "faiss-cpu>=1.11,<1.16; sys_platform != 'darwin'",
]

[project.optional-dependencies]
# Opt in on macOS after repairing the OpenMP clash: `uv pip install faiss-cpu` or this extra.
faiss = [
    "faiss-cpu>=1.11,<1.16",
]
examples = [
    "cartopy>=0.24",
    "matplotlib>=3.9",
    "netCDF4>=1.7.4,<1.7.5",
]
notebooks = [
    "cartopy>=0.24",
    "ipykernel>=6.29",
    "matplotlib>=3.9",
    "nbclient>=0.10",
    "nbformat>=5.10",
    "netCDF4>=1.7.4,<1.7.5",
]

# A dependency group, not an extra, so `uv sync --all-groups` — what the README and CI run —
# actually installs the test and lint tools. `marimo` runs
# `examples/seismic/notebooks/clusters.py`, the interactive version of the clustering sweep.
[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.9",
    "marimo>=0.25.2",
]

[build-system]
requires = ["uv_build>=0.11,<0.12"]
build-backend = "uv_build"

[tool.uv]
required-environments = [
    "sys_platform == 'linux' and platform_machine == 'x86_64'",
    "sys_platform == 'linux' and platform_machine == 'aarch64'",
    "sys_platform == 'darwin' and platform_machine == 'arm64'",
    "sys_platform == 'win32' and platform_machine == 'AMD64'",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"
# `.ipynb` files are generated by `examples/era5/utilities/_build.py` (itself linted); formatting
# the rendered cells would desynchronise them from the generator. `examples/seismic/data/` holds the
# vendored f3-full benchmark package (upstream `loader.py`/`visualize.py`, MIT, unmodified), which
# is data, not our code.
extend-exclude = ["examples/era5/notebooks/*.ipynb", "examples/seismic/data"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
