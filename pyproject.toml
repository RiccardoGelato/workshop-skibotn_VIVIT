[project]
name = "nofe"
version = "0.1.0"
description = "Neural operator function embedding: graph-kernel dimensionality reduction."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "numpy>=2.0",
    "torch>=2.6,<3",
    "torch-geometric>=2.6",
]

# faiss-cpu is capped below 1.16: that is the last series publishing a `macosx_14_0_arm64` wheel
# (1.16.0 jumps to `macosx_15_0_arm64` and ships no sdist), and torch 2.15 supports macOS 14.
[project.optional-dependencies]
examples = [
    "cartopy>=0.24",
    "faiss-cpu>=1.11,<1.16",
    "matplotlib>=3.9",
    "netCDF4>=1.7.4,<1.7.5",
    "scipy>=1.13",
]
notebooks = [
    "cartopy>=0.24",
    "faiss-cpu>=1.11,<1.16",
    "ipykernel>=6.29",
    "matplotlib>=3.9",
    "nbclient>=0.10",
    "nbformat>=5.10",
    "netCDF4>=1.7.4,<1.7.5",
    "scipy>=1.13",
]

[dependency-groups]
# The tests build graphs with the example helpers, so they need scipy and faiss-cpu too.
dev = ["pytest>=8", "ruff>=0.9", "scipy>=1.13", "faiss-cpu>=1.11,<1.16"]

[build-system]
requires = ["uv_build>=0.11,<0.12"]
build-backend = "uv_build"

[tool.uv]
required-environments = [
    "sys_platform == 'linux' and platform_machine == 'x86_64'",
    "sys_platform == 'linux' and platform_machine == 'aarch64'",
    "sys_platform == 'darwin' and platform_machine == 'arm64'",
    "sys_platform == 'win32' and platform_machine == 'AMD64'",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"
# `.ipynb` files are generated by `examples/era5/utilities/_build.py` (itself linted); formatting
# the rendered cells would desynchronise them from the generator. `examples/seismic/data/` holds the
# vendored f3-full benchmark package (upstream `loader.py`/`visualize.py`, MIT, unmodified), which
# is data, not our code.
extend-exclude = ["examples/era5/notebooks/*.ipynb", "examples/seismic/data"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
