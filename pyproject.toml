[project]
name = "nofe"
version = "0.1.0"
description = "Neural operator function embedding: graph-kernel dimensionality reduction."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "numpy>=2.0",
    "scipy>=1.13",
    "faiss-cpu>=1.15,<1.16",
    "torch>=2.6,<3",
    "torch-geometric>=2.6",
]

[project.optional-dependencies]
examples = ["cartopy>=0.24", "matplotlib>=3.9", "netCDF4>=1.7.4,<1.7.5"]
notebooks = [
    "cartopy>=0.24",
    "ipykernel>=6.29",
    "matplotlib>=3.9",
    "nbclient>=0.10",
    "nbformat>=5.10",
    "netCDF4>=1.7.4,<1.7.5",
]

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.9"]

[build-system]
requires = ["uv_build>=0.11,<0.12"]
build-backend = "uv_build"

[tool.uv]
required-environments = [
    "sys_platform == 'linux' and platform_machine == 'x86_64'",
    "sys_platform == 'linux' and platform_machine == 'aarch64'",
    "sys_platform == 'darwin' and platform_machine == 'arm64'",
    "sys_platform == 'win32' and platform_machine == 'AMD64'",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"
# `.ipynb` files are generated by `notebooks/_build.py` (itself linted); formatting the rendered
# cells would desynchronise them from the generator.
extend-exclude = ["notebooks/*.ipynb"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
